# render.yaml — Single Web Service for Galaxy Construction Management System

services:
  - type: web
    name: galaxy-construction
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd .. &&
      rm -rf backend/static && cp -r frontend/dist backend/static &&
      cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: galaxydb
      - key: FRONTEND_URL
        value: "*"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: NODE_VERSION
        value: "20.18.0"
